# Clock discipline for a board with no RTC.
#
# The Pi starts near the epoch after a power cut. A wrong clock breaks the
# Healthchecks report in a silent way: curl refuses the TLS certificate
# ("certificate is not yet valid", because the certificate is not valid yet
# according to the board), so every heartbeat and every /fail is lost while
# the service still exits 0.
#
# The image therefore ships chrony instead of systemd-timesyncd, which did not
# poll on this hardware. chrony steps the clock as soon as it reaches a server,
# so the first ping after boot lands with the right time.
pool 2.debian.pool.ntp.org iburst
# Step rather than slew the first few updates: after a power cut the offset is
# hours or days, and slewing that would take longer than the poll interval.
makestep 1 3
