# Template for secrets.yaml. Create encrypted secrets with:
#   bun run init-sops
# Then edit with:
#   sops secrets.yaml

WIFI_COUNTRY: US
WIFI_SSID: REPLACE_ME_WIFI_SSID
WIFI_PASSWORD: REPLACE_ME_WIFI_PASSWORD
TAILSCALE_AUTH_KEY: REPLACE_ME_TAILSCALE_AUTH_KEY

# Healthchecks.io ping URLs (full URL including uuid).
# HEARTBEAT: pinged on every successful poll (Pi is alive).
# MAINS: success while on wall power, /fail when on battery.
HEALTHCHECKS_HEARTBEAT_URL: https://hc-ping.com/REPLACE_ME_HEARTBEAT_UUID
HEALTHCHECKS_MAINS_URL: https://hc-ping.com/REPLACE_ME_MAINS_UUID

# UPS backend: nut | http
UPS_BACKEND: nut

# NUT (Network UPS Tools) — used when UPS_BACKEND=nut
# Example after installing nut-client against a USB/network UPS:
#   UPS_NUT_NAME: ups@localhost
UPS_NUT_NAME: ups@localhost

# Generic HTTP JSON API — used when UPS_BACKEND=http
# The response JSON is walked with dotted paths (e.g. status.on_battery).
UPS_HTTP_URL: https://ups.local/api/status
UPS_HTTP_ON_BATTERY_PATH: on_battery
UPS_HTTP_BATTERY_PERCENT_PATH: battery.charge
UPS_HTTP_RUNTIME_SECONDS_PATH: battery.runtime
UPS_HTTP_LOAD_PERCENT_PATH: ups.load
UPS_HTTP_HEADERS: ""

# Poll interval for the systemd timer
UPS_POLL_INTERVAL_SECS: "60"

# Hostname prefix (serial suffix appended on first boot)
HOSTNAME_PREFIX: skg-rpi-ups

RPI_DEVICE_CLASS: pi3
RPI_USER: skg
RPI_IMAGE_NAME: pi-ups-monitor
SSH_PUBKEY_PATH: ~/.ssh/id_ed25519.pub
